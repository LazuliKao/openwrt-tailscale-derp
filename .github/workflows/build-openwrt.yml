name: Build OpenWrt Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  update-hash:
    name: Update PKG_HASH
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run update_hash.sh
        run: bash .github/workflows/update_hash.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push if changed
        run: |
          if git diff --quiet --exit-code package/tailscale-derp/Makefile; then
            echo "No changes to Makefile; skipping commit."
          else
            git add package/tailscale-derp/Makefile
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: auto-update PKG_SOURCE_VERSION and PKG_HASH [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  build:
    name: ${{ matrix.pkg }} / ${{ matrix.arch }} (${{ matrix.openwrt_version }})
    runs-on: ubuntu-latest
    needs: [update-hash]
    if: always() && (needs.update-hash.result == 'success' || needs.update-hash.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - tailscale-derp
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_74kc
          - mipsel_mips32
        openwrt_version:
          - "24.10.7"
          - "25.12.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Git pull
        run: git pull origin main || true

      - name: Build with OpenWrt SDK
        id: build_openwrt
        uses: openwrt/gh-action-sdk@main
        env:
          FEEDNAME: custom
          PACKAGES: ${{ matrix.pkg }} luci-app-tailscale-derp
          ARCH: ${{ matrix.arch }}-${{ matrix.openwrt_version }}
          V: ${{ runner.debug == '1' && 's' || '' }}

      - name: List built packages
        run: |
          echo "=== Listing bin directory ==="
          find bin -type f \( -name "*.ipk" -o -name "*.apk" \) || true
          ls -lhR bin/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}-${{ matrix.arch }}-${{ matrix.openwrt_version }}
          path: |
            bin/packages/*/custom/*.ipk
            bin/packages/*/custom/*.apk
            bin/targets/*/*/*.ipk
            bin/targets/*/*/*.apk
          if-no-files-found: error

  nightly:
    name: Nightly Release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts

      - name: Organize Release Files
        run: |
          mkdir -p release
          for artifact_dir in all-artifacts/tailscale-derp-*; do
            if [ -d "$artifact_dir" ]; then
              dirname=$(basename "$artifact_dir")
              arch_version="${dirname#tailscale-derp-}"

              find "$artifact_dir" \( -name "*.ipk" -o -name "*.apk" \) | while read file; do
                filename=$(basename "$file")
                if [[ "$filename" =~ ^(luci-(app|i18n)-tailscale-derp[^_]*)[_-]([0-9]+(\.[0-9]+)*[^_]*)[_-].*\.(ipk|apk)$ ]]; then
                  pkgname="${BASH_REMATCH[1]}"
                  version="${BASH_REMATCH[3]}"
                  ext="${BASH_REMATCH[5]}"
                  newname="${pkgname}_${version}.${ext}"
                  cp "$file" "release/$newname"
                  echo "Copied: $filename -> $newname"
                elif [[ "$filename" =~ ^(tailscale-derp)[_-]([0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?)(_.*)?\.(ipk|apk)$ ]]; then
                  pkgname="${BASH_REMATCH[1]}"
                  version="${BASH_REMATCH[3]}"
                  ext="${BASH_REMATCH[6]}"
                  newname="${pkgname}_${version}_${arch_version}.${ext}"
                  cp "$file" "release/$newname"
                  echo "Copied: $filename -> $newname"
                elif [[ "$filename" =~ ^(.+)-([0-9]+\.[0-9]+\.[0-9]+-r[0-9]+)\.(ipk|apk)$ ]]; then
                  pkgname="${BASH_REMATCH[1]}"
                  version="${BASH_REMATCH[2]}"
                  ext="${BASH_REMATCH[3]}"
                  newname="${pkgname}_${version}_${arch_version}.${ext}"
                  cp "$file" "release/$newname"
                  echo "Copied: $filename -> $newname"
                else
                  if [[ "$filename" == luci-app-tailscale-derp* ]] || [[ "$filename" == luci-i18n-tailscale-derp* ]]; then
                    cp "$file" "release/$filename"
                    echo "Copied: $filename -> $filename"
                  else
                    newname="${filename%.*}_${arch_version}.${filename##*.}"
                    cp "$file" "release/$newname"
                    echo "Copied: $filename -> $newname"
                  fi
                fi
              done
            fi
          done
          cd release
          ls -lh

      - name: Delete existing nightly tag
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: nightly
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Tailscale DERP Relay Nightly Build"
          overwrite_files: true
          body: |
            ## Tailscale DERP Relay OpenWrt Packages — Nightly Build

            Automatic build from commit `${{ github.sha }}` on `main`.

            ### Installation

            ```bash
            opkg install tailscale-derp_*.ipk
            opkg install luci-app-tailscale-derp_*.ipk
            # For APK format (newer OpenWrt versions):
            apk add tailscale-derp_*.apk
            apk add luci-app-tailscale-derp_*.apk
            ```

            ### Supported Architectures
            - x86_64
            - aarch64
            - arm
            - mips
            - mipsel
          files: |
            release/*.ipk
            release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
